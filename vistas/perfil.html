<!DOCTYPE html>
<html lang="es" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskQuest - Mi Perfil</title>
    <link href="../estilos/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="fondo-gradiente min-h-screen">
    
    <nav class="flex justify-between items-center gap-3 mb-4 p-4 bg-white/10 dark:bg-black/20 backdrop-blur-md sticky top-0 z-40">
        <a href="index.html" class="flex items-center space-x-2 text-indigo-600 dark:text-indigo-400 font-bold hover:opacity-80">
            <i class="fas fa-arrow-left"></i> <span>Volver a Misiones</span>
        </a>
        <button id="btn-tema" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-all text-white">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-gaming text-pink-500 mb-4 drop-shadow-md"><i class="fas fa-user-ninja"></i> Creación de Personaje</h1>
            <p class="text-gray-700 dark:text-gray-300 text-lg">Define tu avatar y tu nombre de héroe.</p>
        </div>

        <div class="card dark:bg-slate-800 p-8 shadow-xl">
            <form id="form-perfil" class="space-y-6">
                <!-- Nombre -->
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">Nombre del Héroe</label>
                    <input type="text" id="input-nombre" placeholder="Ej: Arthas, El Productivo" required
                        class="w-full p-3 rounded-lg bg-gray-50 dark:bg-slate-700 border border-gray-300 dark:border-slate-600 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500">
                </div>

                <!-- Clase / Avatar -->
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 font-bold mb-4">Elige tu Clase</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        
                        <!-- Guerrero -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="clase" value="guerrero" class="peer sr-only" checked>
                            <div class="p-6 rounded-xl border-2 border-transparent peer-checked:border-pink-500 peer-checked:bg-pink-50 dark:peer-checked:bg-pink-900/20 hover:bg-gray-50 dark:hover:bg-slate-700 transition-all text-center">
                                <i class="fas fa-khanda text-4xl text-red-500 mb-3"></i>
                                <h3 class="font-bold dark:text-white">Guerrero</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Gana 5% más de XP en tareas difíciles.</p>
                            </div>
                        </label>

                        <!-- Mago -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="clase" value="mago" class="peer sr-only">
                            <div class="p-6 rounded-xl border-2 border-transparent peer-checked:border-blue-500 peer-checked:bg-blue-50 dark:peer-checked:bg-blue-900/20 hover:bg-gray-50 dark:hover:bg-slate-700 transition-all text-center">
                                <i class="fas fa-hat-wizard text-4xl text-blue-500 mb-3"></i>
                                <h3 class="font-bold dark:text-white">Mago</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Gana 10% más de XP en tareas fáciles.</p>
                            </div>
                        </label>

                        <!-- Arquero -->
                        <label class="cursor-pointer relative">
                            <input type="radio" name="clase" value="arquero" class="peer sr-only">
                            <div class="p-6 rounded-xl border-2 border-transparent peer-checked:border-green-500 peer-checked:bg-green-50 dark:peer-checked:bg-green-900/20 hover:bg-gray-50 dark:hover:bg-slate-700 transition-all text-center">
                                <i class="fas fa-bow-arrow text-4xl text-green-500 mb-3"></i>
                                <h3 class="font-bold dark:text-white">Arquero</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Bonus extra al terminar los Pomodoros.</p>
                            </div>
                        </label>

                    </div>
                </div>

                <div class="text-center pt-6">
                    <button type="submit" class="btn-primary w-full md:w-auto px-8 py-3 text-lg font-bold bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700">
                        <i class="fas fa-save mr-2"></i> Guardar Personaje
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Tema
        const btnTema = document.getElementById('btn-tema');
        const temaOscuro = localStorage.getItem('temaOscuro') === 'true';
        if (temaOscuro) document.documentElement.classList.add('dark');
        
        btnTema.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('temaOscuro', document.documentElement.classList.contains('dark'));
        });

        // Lógica del Perfil
        document.addEventListener('DOMContentLoaded', () => {
            const perfilGuardado = JSON.parse(localStorage.getItem('taskquest_perfil') || '{"nombre":"", "clase":"guerrero"}');
            document.getElementById('input-nombre').value = perfilGuardado.nombre;
            const radioClase = document.querySelector(`input[name="clase"][value="${perfilGuardado.clase}"]`);
            if(radioClase) radioClase.checked = true;
        });

        document.getElementById('form-perfil').addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('input-nombre').value;
            const clase = document.querySelector('input[name="clase"]:checked').value;
            
            localStorage.setItem('taskquest_perfil', JSON.stringify({ nombre, clase }));
            
            // Animación de botón
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check mr-2"></i> ¡Guardado!';
            btn.classList.add('bg-green-500');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-500');
                window.location.href = 'index.html';
            }, 1000);
        });
    </script>
</body>
</html>
