<!DOCTYPE html>
<html lang="es" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskQuest - Logros</title>
    <link href="../estilos/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="fondo-gradiente min-h-screen">
    
    <nav class="flex justify-between items-center gap-3 mb-4 p-4 bg-white/10 dark:bg-black/20 backdrop-blur-md sticky top-0 z-40">
        <a href="index.html" class="flex items-center space-x-2 text-indigo-600 dark:text-indigo-400 font-bold hover:opacity-80">
            <i class="fas fa-arrow-left"></i> <span>Volver a Misiones</span>
        </a>
        <button id="btn-tema" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-all text-white">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-gaming text-amber-500 mb-4 drop-shadow-md"><i class="fas fa-medal"></i> Logros Desbloqueados</h1>
            <p class="text-gray-700 dark:text-gray-300 text-lg">Tus hazañas como guerrero de la productividad.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="contenedor-logros">
            <!-- Renderizado vía JS -->
        </div>
    </main>

    <script>
        // Tema
        const btnTema = document.getElementById('btn-tema');
        const temaOscuro = localStorage.getItem('temaOscuro') === 'true';
        if (temaOscuro) document.documentElement.classList.add('dark');
        
        btnTema.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('temaOscuro', document.documentElement.classList.contains('dark'));
        });

        // Lógica de Logros (Simple)
        const jugador = JSON.parse(localStorage.getItem('taskquest_jugador') || '{"nivel":1, "tareasCompletadas":0, "racha":0}');
        
        const listaLogros = [
            { id: 1, titulo: "Primeros Pasos", desc: "Alcanza el Nivel 2", req: () => jugador.nivel >= 2, icono: "fa-shoe-prints", color: "text-blue-500" },
            { id: 2, titulo: "Veterano", desc: "Alcanza el Nivel 10", req: () => jugador.nivel >= 10, icono: "fa-star", color: "text-yellow-500" },
            { id: 3, titulo: "Imparable", desc: "Racha de 3 días seguidos", req: () => (jugador.racha || 0) >= 3, icono: "fa-fire", color: "text-red-500" },
            { id: 4, titulo: "Máquina", desc: "Completa 10 tareas en total", req: () => (jugador.tareasCompletadas || 0) >= 10, icono: "fa-cogs", color: "text-gray-500" }
        ];

        const contenedor = document.getElementById('contenedor-logros');
        listaLogros.forEach(logro => {
            const desbloqueado = logro.req();
            
            const div = document.createElement('div');
            div.className = `p-4 rounded-xl border-2 flex items-center gap-4 transition-all ${desbloqueado ? 'border-amber-500 bg-amber-50 dark:bg-amber-900/20' : 'border-gray-200 dark:border-gray-700 opacity-50 grayscale'}`;
            
            div.innerHTML = `
                <div class="text-4xl ${desbloqueado ? logro.color : 'text-gray-400'}">
                    <i class="fas ${logro.icono}"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg dark:text-white">${logro.titulo}</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-400">${logro.desc}</p>
                </div>
                <div class="ml-auto text-2xl">
                    ${desbloqueado ? '<i class="fas fa-check-circle text-green-500"></i>' : '<i class="fas fa-lock text-gray-400"></i>'}
                </div>
            `;
            contenedor.appendChild(div);
        });
    </script>
</body>
</html>
