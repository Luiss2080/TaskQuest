<!DOCTYPE html>
<html lang="es" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskQuest - Tienda de Recompensas</title>
    
    <link rel="manifest" href="../manifest.json">
    <link href="../estilos/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="fondo-gradiente min-h-screen">
    
    <nav class="flex justify-between items-center gap-3 mb-4 p-4 bg-white/10 dark:bg-black/20 backdrop-blur-md sticky top-0 z-40">
        <a href="index.html" class="flex items-center space-x-2 text-indigo-600 dark:text-indigo-400 font-bold">
            <i class="fas fa-arrow-left"></i> <span>Volver a Misiones</span>
        </a>
        <div class="flex gap-3">
            <div class="px-4 py-2 bg-yellow-100 dark:bg-yellow-900/50 text-yellow-600 dark:text-yellow-400 rounded-lg font-bold flex items-center">
                <i class="fas fa-coins mr-2"></i> <span id="monedas-display">0</span>
            </div>
            <button id="btn-tema" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-all text-white" title="Cambiar Tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-gaming text-yellow-500 mb-4 animate-pulse"><i class="fas fa-store"></i> Mercado Épico</h1>
            <p class="text-gray-700 dark:text-gray-300">Gasta tus monedas ganadas en recompensas de la vida real.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="lista-recompensas">
            <!-- Item 1 -->
            <div class="card dark:bg-slate-800 transition-transform hover:-translate-y-2">
                <div class="text-5xl text-center mb-4 text-purple-500"><i class="fas fa-tv"></i></div>
                <h3 class="font-bold text-xl mb-2 text-center dark:text-white">1 Hora de Series</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 text-center">Mira un capítulo de tu serie favorita sin culpa.</p>
                <button class="w-full btn-primary bg-yellow-500 hover:bg-yellow-600 flex justify-between items-center">
                    <span>Comprar</span>
                    <span class="font-bold"><i class="fas fa-coins text-sm"></i> 500</span>
                </button>
            </div>

            <!-- Item 2 -->
            <div class="card dark:bg-slate-800 transition-transform hover:-translate-y-2">
                <div class="text-5xl text-center mb-4 text-green-500"><i class="fas fa-gamepad"></i></div>
                <h3 class="font-bold text-xl mb-2 text-center dark:text-white">30 Min. Videojuegos</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 text-center">Juega una partida de tu juego favorito.</p>
                <button class="w-full btn-primary bg-yellow-500 hover:bg-yellow-600 flex justify-between items-center">
                    <span>Comprar</span>
                    <span class="font-bold"><i class="fas fa-coins text-sm"></i> 300</span>
                </button>
            </div>

            <!-- Item 3 -->
            <div class="card dark:bg-slate-800 transition-transform hover:-translate-y-2">
                <div class="text-5xl text-center mb-4 text-pink-500"><i class="fas fa-ice-cream"></i></div>
                <h3 class="font-bold text-xl mb-2 text-center dark:text-white">Snack Especial</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 text-center">Cómete ese postre o dulce que guardabas.</p>
                <button class="w-full btn-primary bg-yellow-500 hover:bg-yellow-600 flex justify-between items-center">
                    <span>Comprar</span>
                    <span class="font-bold"><i class="fas fa-coins text-sm"></i> 150</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        // Tema y UI básica
        const btnTema = document.getElementById('btn-tema');
        const temaOscuro = localStorage.getItem('temaOscuro') === 'true';
        if (temaOscuro) document.documentElement.classList.add('dark');
        
        btnTema.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('temaOscuro', document.documentElement.classList.contains('dark'));
        });
        
        // Cargar monedas (simplificado)
        const jugador = JSON.parse(localStorage.getItem('taskquest_jugador') || '{}');
        document.getElementById('monedas-display').textContent = (jugador.xp || 0) * 2; // Ejemplo: 2 monedas por cada XP
    </script>
</body>
</html>
